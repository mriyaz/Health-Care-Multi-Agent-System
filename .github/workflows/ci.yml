# P0#14: lint + tests on every PR. Fast job (<3 min target): pip cache, single runner, no Docker services.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Black (check only)
        run: black --check .

      - name: Flake8
        run: flake8 .

      - name: Pytest
        run: pytest -q

      - name: Reject published secrets and static demo passwords
        run: |
          if git grep -n -E -e "BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY" -e "[A-Za-z]+123!" -e "sk-or-v1-" -e "sk-proj-" -- .; then
            echo "Refusing patterns that look like secrets or reusable demo passwords."
            exit 1
          fi
          echo "No blocked secret patterns found."
