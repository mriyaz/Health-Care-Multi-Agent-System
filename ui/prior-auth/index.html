<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthOS — Prior Auth Tracker</title>
  <link rel="stylesheet" href="/ui/shared/healthos.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div>
        <h1>Prior Auth Tracker</h1>
        <p class="subtitle">Demo board only · prior-auth agent is not implemented</p>
      </div>
    </div>
    <div id="auth-status" class="auth-status">Not signed in</div>
  </header>
  <nav class="top-nav"></nav>

  <main class="layout layout-wide">
    <section id="login-panel" class="card">
      <h2>Sign in</h2>
      <form id="login-form" class="form-grid">
        <label>Username <input type="text" id="username" value="clinician" required /></label>
        <label>Password <input type="password" id="password" required /></label>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <p id="login-error" class="error hidden"></p>
    </section>

    <section id="board-panel" class="card hidden">
      <div class="panel-head">
        <h2>Authorization board</h2>
        <button id="seed-btn" class="btn btn-secondary btn-sm">Seed demo cards</button>
      </div>
      <p id="board-note" class="hint"></p>
      <div class="kanban" id="kanban"></div>
      <p id="board-error" class="error hidden"></p>
    </section>
  </main>
  <footer class="app-footer">HealthOS · Prior Auth (demo until Section F agent ships)</footer>
  <script src="/ui/shared/healthos.js"></script>
  <script src="app.js"></script>
</body>
</html>
