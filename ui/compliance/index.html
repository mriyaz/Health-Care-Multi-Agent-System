<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthOS — Compliance Reports</title>
  <link rel="stylesheet" href="/ui/shared/healthos.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div>
        <h1>Compliance Reports</h1>
        <p class="subtitle">Audit trail filter · CSV export · #106</p>
      </div>
    </div>
    <div id="auth-status" class="auth-status">Not signed in</div>
  </header>
  <nav class="top-nav"></nav>

  <main class="layout layout-wide">
    <section id="login-panel" class="card">
      <h2>Sign in</h2>
      <form id="login-form" class="form-grid">
        <label>Username <input type="text" id="username" value="admin" required /></label>
        <label>Password <input type="password" id="password" required /></label>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <p id="login-error" class="error hidden"></p>
    </section>

    <section id="compliance-panel" class="card hidden">
      <h2>Filter audit trail</h2>
      <div class="form-grid">
        <label>Action contains <input id="filter-action" placeholder="e.g. RCM_CODE" /></label>
        <label>Actor ID <input id="filter-actor" placeholder="user UUID" /></label>
        <label>Resource type <input id="filter-resource" placeholder="e.g. claim" /></label>
        <label>Date from <input type="date" id="filter-from" /></label>
        <label>Date to <input type="date" id="filter-to" /></label>
        <div class="actions" style="align-items:flex-end">
          <button id="search-btn" class="btn btn-primary">Search</button>
          <button id="export-btn" class="btn btn-secondary">Export CSV</button>
        </div>
      </div>

      <div style="overflow-x:auto;margin-top:1rem">
        <table class="data-table" id="audit-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Action</th>
              <th>Actor</th>
              <th>Type</th>
              <th>Resource</th>
              <th>Task</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="compliance-error" class="error hidden"></p>
    </section>
  </main>
  <footer class="app-footer">HealthOS · local audit trail (not a compliance certification)</footer>
  <script src="/ui/shared/healthos.js"></script>
  <script src="app.js"></script>
</body>
</html>
